<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Faery Books moved</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://gardenfaery.love/admin">
  <style>
    body { font-family: -apple-system, sans-serif; background: #f8f4ed; color: #4a1942; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .box { max-width: 420px; }
    h1 { font-size: 1.4rem; margin-bottom: 12px; }
    a { color: #4a1942; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Garden Faery Books moved</h1>
    <p>Bookkeeping now lives inside the admin at <a href="https://gardenfaery.love/admin">gardenfaery.love/admin</a>.</p>
    <p>Redirecting...</p>
  </div>
  <script>
    // Unregister any installed service worker + clear its caches so this
    // old PWA doesn't keep serving stale content from the home screen.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    }
    if (window.caches) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
    setTimeout(() => { location.replace('https://gardenfaery.love/admin'); }, 100);
  </script>
</body>
</html>
